
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Audio Visualizer (Mild Version)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 背景：ダークブルーから黒への放射状グラデーション */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        }

        /* UI: SF映画風ガラスモーフィズムボタン */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn {
            border: 2px solid #00ffff;
            color: #00ffff;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            backdrop-filter: blur(10px); /* ガラスモーフィズム */
            -webkit-backdrop-filter: blur(10px);
            border-radius: 4px;
            box-shadow: 0 0 10px #00ffff, inset 0 0 5px #00ffff;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px #00ffff;
        }

        .btn:hover {
            background-color: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 20px #00ffff, inset 0 0 10px #00ffff;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        #status {
            margin-top: 10px;
            color: #ff00ff;
            font-size: 12px;
            text-shadow: 0 0 3px #ff00ff;
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-container">
        <div class="upload-btn-wrapper">
            <button class="btn">Upload Audio</button>
            <input type="file" id="file-input" accept="audio/*" />
        </div>
        <div id="status">Ready to initialize system...</div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- 設定定数 ---
        const COLORS = {
            cyan: 0x00ffff,
            magenta: 0xff00ff,
            white: 0xffffff,
            bgCenter: 0x1a1a2e
        };

        // --- シーン初期化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        container.appendChild(renderer.domElement);

        // --- コントロール ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0; // 基本の回転速度を少し下げる

        // --- ポストプロセス (Bloom) ---
        const renderScene = new RenderPass(scene, camera);
        // Bloomの強度も少し抑えめに調整
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
        bloomPass.strength = 2.0;
        bloomPass.radius = 0.5;
        bloomPass.threshold = 0.1;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- オブジェクト作成 ---

        // 1. メインオブジェクト: ワイヤーフレーム球体
        const geometryMain = new THREE.IcosahedronGeometry(10, 4);
        geometryMain.userData.originalPositions = geometryMain.attributes.position.array.slice(); 
        
        const materialMain = new THREE.MeshBasicMaterial({ 
            color: COLORS.cyan, 
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const mainSphere = new THREE.Mesh(geometryMain, materialMain);
        scene.add(mainSphere);

        // 2. インナーコア: ソリッド球体
        const geometryCore = new THREE.SphereGeometry(4, 32, 32);
        const materialCore = new THREE.MeshBasicMaterial({ 
            color: COLORS.magenta 
        });
        const innerCore = new THREE.Mesh(geometryCore, materialCore);
        scene.add(innerCore);

        // 3. パーティクルシステム
        const particleCount = 800; // パーティクル数も少し減らす
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleVelocities = [];

        for(let i = 0; i < particleCount; i++) {
            const r = 20 + Math.random() * 40;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            particlePositions[i * 3] = x;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = z;

            // 基本速度を遅くする
            particleVelocities.push({
                x: (Math.random() - 0.5) * 0.05,
                y: (Math.random() - 0.5) * 0.05,
                z: (Math.random() - 0.5) * 0.05
            });
        }
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMaterial = new THREE.PointsMaterial({
            color: COLORS.white,
            size: 0.2,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // --- Audio API Setup ---
        let audioContext, analyser, dataArray;
        let isAudioPlaying = false;
        let audioSource;

        // UI Event
        const fileInput = document.getElementById('file-input');
        const statusDiv = document.getElementById('status');
        const btn = document.querySelector('.btn');

        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            btn.textContent = "Loading...";
            statusDiv.style.opacity = 1;
            statusDiv.textContent = "Processing Audio Data...";

            if (audioContext) audioContext.close();
            audioContext = new (window.AudioContext || window.webkitAudioContext)();

            const reader = new FileReader();
            reader.onload = function(ev) {
                audioContext.decodeAudioData(ev.target.result, function(buffer) {
                    if (audioSource) audioSource.stop();
                    audioSource = audioContext.createBufferSource();
                    audioSource.buffer = buffer;

                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 2048;
                    
                    audioSource.connect(analyser);
                    analyser.connect(audioContext.destination);

                    dataArray = new Uint8Array(analyser.frequencyBinCount);

                    audioSource.start(0);
                    isAudioPlaying = true;
                    btn.textContent = "Playing";
                    statusDiv.textContent = "Visualizer Active";
                }, function(e) {
                    console.error("Error decoding audio data", e);
                    btn.textContent = "Error";
                });
            };
            reader.readAsArrayBuffer(file);
        });

        // --- カメラシェイク用変数 ---
        let shakeIntensity = 0;

        // --- アニメーションループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            let bassLevel = 0;
            let midHighLevel = 0;

            if (isAudioPlaying && analyser) {
                analyser.getByteFrequencyData(dataArray);
                const bufferLength = analyser.frequencyBinCount;
                
                // 低音 (Bass)
                let bassSum = 0;
                for(let i = 0; i < 20; i++) bassSum += dataArray[i];
                bassLevel = bassSum / 20; // 0-255

                // 中高音 (Mid-High)
                let midHighSum = 0;
                for(let i = 100; i < 500; i++) midHighSum += dataArray[i];
                midHighLevel = midHighSum / 400; // 0-255
            }

            // 1. メインオブジェクトの変形 (Vertex Displacement)
            const positions = geometryMain.attributes.position.array;
            const originalPositions = geometryMain.userData.originalPositions;
            
            // 【修正】感度調整: 係数を大幅に下げて変形をマイルドにする
            const displacementScale = Math.max(0, (midHighLevel - 40) / 255) * 2.5; 

            for(let i = 0; i < positions.length; i += 3) {
                const ox = originalPositions[i];
                const oy = originalPositions[i+1];
                const oz = originalPositions[i+2];

                const noise = Math.sin(i * 0.1 + clock.getElapsedTime() * 3) * 0.5 + 0.5; // ノイズの速度も少し落とす
                // 変形係数
                const amount = 1 + (displacementScale * noise * (Math.random() > 0.5 ? 1.2 : 0.8));

                positions[i] = ox * amount;
                positions[i+1] = oy * amount;
                positions[i+2] = oz * amount;
            }
            geometryMain.attributes.position.needsUpdate = true;

            // マテリアル発光制御
            if (bassLevel > 180) {
                materialMain.color.lerp(new THREE.Color(COLORS.white), 0.5); // 完全に白にせずLerpで和らげる
                materialMain.opacity = 0.9;
            } else {
                materialMain.color.lerp(new THREE.Color(COLORS.cyan), 0.1);
                materialMain.opacity = 0.4 + (bassLevel / 255) * 0.3;
            }

            // 2. インナーコアの鼓動 (Scale Pulse)
            // 【修正】最大スケールを抑える
            const scale = 1 + (bassLevel / 255) * 0.6; 
            innerCore.scale.set(scale, scale, scale);
            
            // 色味の変化
            const coreColor = new THREE.Color(COLORS.magenta);
            if(bassLevel > 200) coreColor.setHex(0xff0088);
            innerCore.material.color.lerp(coreColor, 0.15);

            // 3. パーティクルアニメーション
            const pPos = particleGeometry.attributes.position.array;
            for(let i = 0; i < particleCount; i++) {
                // 【修正】拡散速度の加速を抑える
                const speedMult = 1 + (bassLevel / 255) * 1.0;
                
                pPos[i*3] += particleVelocities[i].x * speedMult;
                pPos[i*3+1] += particleVelocities[i].y * speedMult;
                pPos[i*3+2] += particleVelocities[i].z * speedMult;

                const dist = Math.sqrt(pPos[i*3]**2 + pPos[i*3+1]**2 + pPos[i*3+2]**2);
                if (dist > 80) {
                    const r = 20;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    pPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                    pPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                    pPos[i*3+2] = r * Math.cos(phi);
                }
            }
            particleGeometry.attributes.position.needsUpdate = true;
            particles.material.size = 0.2 + (midHighLevel / 255) * 0.3; // サイズ変化も少し抑える

            // 4. カメラシェイク
            if (bassLevel > 235) { // しきい値を少し上げて反応頻度を下げる
                shakeIntensity = 0.5; // 【修正】揺れ幅を小さくする
            }

            if (shakeIntensity > 0) {
                const rx = (Math.random() - 0.5) * shakeIntensity;
                const ry = (Math.random() - 0.5) * shakeIntensity;
                const rz = (Math.random() - 0.5) * shakeIntensity;
                
                camera.position.add(new THREE.Vector3(rx, ry, rz));
                
                shakeIntensity *= 0.85; // 減衰を早める
                if (shakeIntensity < 0.05) shakeIntensity = 0;
            }
            
            // 5. 自動回転速度の調整
            controls.update();
            const avgLevel = (bassLevel + midHighLevel) / 2;
            // 【修正】回転速度の最大値を抑える
            controls.autoRotateSpeed = 1.0 + (avgLevel / 255) * 4.0;

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
