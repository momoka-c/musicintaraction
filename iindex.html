<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Font Extractor (ZINE Creator Version)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>SVG Font Extractor & ZINE Creator</h1>
        <p class="description">画像をアップロードして範囲を選択し、ZINEの1ページを生成します</p>
        
        <div id="status">OpenCV.js を読み込み中...</div>
        <br>
        
        <label id="uploadLabel" class="btn btn-blue disabled">
            画像を選択する
            <input type="file" id="fileInput" accept="image/*" disabled>
        </label>

        <div id="cropContainer" class="crop-container">
            <img id="imageToCrop" src="" alt="Picture">
        </div>

        <div id="zineFormSection" class="zine-form-section">
            <h3>ZINE ページテキスト設定</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="inputHashtag">誌名 / ハッシュタグ</label>
                    <input type="text" id="inputHashtag" value="#街角写取録">
                </div>
                <div class="form-group">
                    <label for="inputNumber">通し番号</label>
                    <input type="text" id="inputNumber" value="01">
                </div>
                <div class="form-group">
                    <label for="inputLocation">採取地 (左下)</label>
                    <input type="text" id="inputLocation" value="新宿区水道町">
                </div>
                <div class="form-group">
                    <label for="inputMemo">一言メモ (右下)</label>
                    <input type="text" id="inputMemo" value="裏ドアまで可愛い">
                </div>
                <div class="form-group full-width">
                    <label for="themeColor">テーマカラー（グラフィック・文字色）</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="themeColor" value="#f15a24">
                        <span style="font-size: 0.85rem; color: #64748b;">サンプルの美しい朱色にセットされています</span>
                    </div>
                </div>
            </div>
            <button id="extractBtn" class="btn btn-orange" style="width: 100%;">選択範囲からZINEページを生成・記録</button>
        </div>

        <div id="previewArea" class="preview-area">
            <h3 style="font-size: 1rem; color: #34495e; margin-bottom: 12px;">現在の2値化プレビュー (輪郭抽出確認用)</h3>
            <canvas id="canvasOutput"></canvas>
        </div>

        <div class="stamp-gallery-section">
            <h2 class="stamp-gallery-title">生成されたZINEページ一覧</h2>
            <div id="stampList" class="stamp-list"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <script src="script.js"></script>
    
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
</body>
</html>
